<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U Mastina – Obedové menu</title><style>body{margin:0;background:#f2efe9;color:#30261e;font:16px system-ui}header{background:#244b3f;color:white;padding:18px;text-align:center}main{max-width:1100px;margin:20px auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.paper{background:white;border-radius:14px;padding:22px;box-shadow:0 2px 12px #0001}label{display:block;font-weight:650;margin-top:12px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font:inherit;margin-top:5px}button{border:0;border-radius:8px;background:#244b3f;color:white;padding:11px 14px;font:inherit;cursor:pointer;margin:6px 4px 0 0}.danger{background:#8c4b3e}.meal{border-top:1px solid #ddd;padding:12px 0}.paper{min-height:520px;text-align:center;border:2px solid #d7c8ac}.paper h1{font: bold 36px Georgia;color:#59432e;margin-bottom:3px}.paper h2{font:20px Georgia;letter-spacing:4px;color:#94724b}.dish{text-align:left;margin:18px 0}.dish strong{display:block}.dish small{color:#666}.price{float:right}#notice{color:#356c51}@media(max-width:750px){main{grid-template-columns:1fr}.paper h1{font-size:29px}}@media print{header,.panel{display:none}main{display:block;margin:0}.paper{box-shadow:none;border:0;min-height:0}body{background:white}}</style></head><body><header><strong>REŠTAURÁCIA U MASTINA</strong> · Editor obedového menu</header><main><section class="panel"><label>Dátum<input id="date" type="date"></label><label>Polievka<input id="soup" placeholder="Kurací vývar"></label><label>Spoločná cena menu (€)<input id="price" type="number" min="0" step=".01" value="7"></label><label>Text v pätičke<input id="footer" value="Objednávky cez Bolt Food"></label><h3>Hlavné jedlá</h3><div id="meals"></div><button id="add" type="button">+ Pridať jedlo</button><button id="save" type="button">Uložiť deň</button><button id="print" type="button">Tlačiť / PDF</button><label>Načítať uložený deň<select id="saved" style="width:100%;padding:10px"></select></label><p id="notice"></p></section><section class="paper" id="preview"><h1>REŠTAURÁCIA<br>U MASTINA</h1><h2>OBEDOVÉ MENU</h2><div id="pdate"></div><h3>Polievka</h3><div id="psoup">—</div><h3>Hlavné jedlá</h3><div id="pdishes"></div><p id="pfooter"></p></section></main><script>
const $=id=>document.getElementById(id);let meals=[];const key='mastina_menu_v1_';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addMeal(m={name:'',side:'',price:''}){meals.push(m);renderEditor();preview()}function renderEditor(){const root=$('meals');root.innerHTML='';meals.forEach((m,i)=>{const d=document.createElement('div');d.className='meal';d.innerHTML='<b>Jedlo '+(i+1)+'</b><label>Názov<input class="name" placeholder="Vyprážaný syr"></label><label>Príloha / popis<input class="side" placeholder="Zemiaky, tatárska omáčka"></label><label>Cena (€), voliteľné<input class="cost" type="number" min="0" step=".01"></label><button class="danger" type="button">Odstrániť</button>';d.querySelector('.name').value=m.name;d.querySelector('.side').value=m.side;d.querySelector('.cost').value=m.price;[['name','name'],['side','side'],['cost','price']].forEach(([cl,k])=>d.querySelector('.'+cl).addEventListener('input',e=>{m[k]=e.target.value;preview()}));d.querySelector('button').onclick=()=>{meals.splice(i,1);renderEditor();preview()};root.appendChild(d)})}function preview(){$('psoup').textContent=$('soup').value||'—';const dt=$('date').value;$('pdate').textContent=dt?new Date(dt+'T12:00:00').toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';$('pdishes').innerHTML=meals.filter(m=>m.name.trim()).map((m,i)=>'<div class="dish"><span class="price">'+esc(m.price||$('price').value)+' €</span><strong>'+(i+1)+'. '+esc(m.name)+'</strong><small>'+esc(m.side)+'</small></div>').join('')||'Zatiaľ žiadne jedlá';$('pfooter').textContent=$('footer').value}function refreshSaved(){const dates=Object.keys(localStorage).filter(k=>k.startsWith(key)).map(k=>k.slice(key.length)).sort().reverse();$('saved').innerHTML='<option value="">Vyber dátum</option>'+dates.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('')}function load(d){let x=JSON.parse(localStorage.getItem(key+d)||'null');if(!x)return;$('date').value=d;$('soup').value=x.soup;$('price').value=x.price;$('footer').value=x.footer;meals=x.meals||[];renderEditor();preview()}['date','soup','price','footer'].forEach(id=>$(id).addEventListener('input',preview));$('add').onclick=()=>addMeal();$('save').onclick=()=>{let d=$('date').value;if(!d){$('notice').textContent='Najprv vyber dátum.';return}localStorage.setItem(key+d,JSON.stringify({soup:$('soup').value,price:$('price').value,footer:$('footer').value,meals}));$('notice').textContent='Menu uložené pre '+d;refreshSaved()};$('saved').onchange=e=>load(e.target.value);$('print').onclick=()=>window.print();$('date').value=new Date().toLocaleDateString('en-CA');addMeal();addMeal();addMeal();refreshSaved();preview();</script></body></html>
