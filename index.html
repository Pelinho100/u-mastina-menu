<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U Mastina – Obedové menu</title><style>body{margin:0;background:#f2efe9;color:#30261e;font:16px system-ui}header{background:#244b3f;color:white;padding:18px;text-align:center}main{max-width:1100px;margin:20px auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.paper{background:white;border-radius:14px;padding:22px;box-shadow:0 2px 12px #0001}label{display:block;font-weight:650;margin-top:12px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font:inherit;margin-top:5px}button{border:0;border-radius:8px;background:#244b3f;color:white;padding:11px 14px;font:inherit;cursor:pointer;margin:6px 4px 0 0}.danger{background:#8c4b3e}.meal{border-top:1px solid #ddd;padding:12px 0}.paper{min-height:520px;text-align:center;border:2px solid #d7c8ac}.paper h1{font: bold 36px Georgia;color:#59432e;margin-bottom:3px}.paper h2{font:20px Georgia;letter-spacing:4px;color:#94724b}.dish{text-align:left;margin:18px 0}.dish strong{display:block}.dish small{color:#666}.price{float:right}#notice{color:#356c51}@media(max-width:750px){main{grid-template-columns:1fr}.paper h1{font-size:29px}}@media print{header,.panel{display:none}main{display:block;margin:0}.paper{box-shadow:none;border:0;min-height:0}body{background:white}}</style></head><body><header><strong>REŠTAURÁCIA U MASTINA</strong> · Editor obedového menu</header><main><section class="panel"><label>Dátum<input id="date" type="date"></label><label>Polievka<input id="soup" list="soupsList" placeholder="Kurací vývar"></label><datalist id="soupsList"></datalist><label>Vybrať polievku z databázy<select id="soupSelect"><option value="">Vyber uloženú polievku</option></select></label><label>Spoločná cena menu (€)<input id="price" type="number" min="0" step=".01" value="7"></label><label>Text v pätičke<input id="footer" value="Objednávky cez Bolt Food"></label><h3>Hlavné jedlá</h3><div id="meals"></div><h3>Databáza jedál a polievok</h3><p>Pri uložení dňa sa názvy jedál, prílohy aj polievka automaticky pridajú do databázy v tomto prehliadači.</p><button id="export" type="button">Exportovať databázu a menu</button><label>Importovať zálohu<input id="import" type="file" accept=".json,application/json"></label><button id="add" type="button">+ Pridať jedlo</button><button id="save" type="button">Uložiť deň</button><button id="print" type="button">Tlačiť / PDF</button><label>Načítať uložený deň<select id="saved" style="width:100%;padding:10px"></select></label><p id="notice"></p></section><section class="paper" id="preview"><h1>REŠTAURÁCIA<br>U MASTINA</h1><h2>OBEDOVÉ MENU</h2><div id="pdate"></div><h3>Polievka</h3><div id="psoup">—</div><h3>Hlavné jedlá</h3><div id="pdishes"></div><p id="pfooter"></p></section></main><script>
const $=id=>document.getElementById(id),key='mastina_menu_v1_',dbkey='mastina_database_v2';
let meals=[],db={soups:[],dishes:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLocaleLowerCase('sk');
function readDB(){try{let v=JSON.parse(localStorage.getItem(dbkey)||'{}');db={soups:Array.isArray(v.soups)?v.soups:[],dishes:Array.isArray(v.dishes)?v.dishes:[]}}catch(e){db={soups:[],dishes:[]}}}
function saveDB(){localStorage.setItem(dbkey,JSON.stringify(db));refreshDB()}
function refreshDB(){const s=$('soupSelect');s.innerHTML='<option value="">Vyber uloženú polievku</option>';const l=$('soupsList');l.innerHTML='';db.soups.forEach(v=>{let o=document.createElement('option');o.value=v;s.appendChild(o);l.appendChild(o.cloneNode())});document.querySelectorAll('.dish-select').forEach(select=>{const selected=select.value;select.innerHTML='<option value="">Vyber jedlo z databázy</option>';db.dishes.forEach((d,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=d.name;select.appendChild(o)});select.value=selected})}
function remember(){let soup=$('soup').value.trim();if(soup&&!db.soups.some(s=>norm(s)===norm(soup)))db.soups.push(soup);meals.forEach(m=>{if(!m.name.trim())return;const item={name:m.name.trim(),side1:m.side1||'',side2:m.side2||'',price:m.price||''};let i=db.dishes.findIndex(d=>norm(d.name)===norm(item.name));if(i>=0)db.dishes[i]=item;else db.dishes.push(item)});saveDB()}
function addMeal(m={}){meals.push({name:m.name||'',side1:m.side1??m.side??'',side2:m.side2||'',price:m.price||''});renderEditor();preview()}
function renderEditor(){const root=$('meals');root.innerHTML='';meals.forEach((m,i)=>{const d=document.createElement('div');d.className='meal';d.innerHTML='<b>Jedlo '+(i+1)+'</b><label>Vybrať z databázy<select class="dish-select"><option value="">Vyber jedlo</option></select></label><label>Názov jedla<input class="name" placeholder="Vyprážaný syr"></label><label>Príloha 1<input class="side1" placeholder="Zemiaky"></label><label>Príloha 2<input class="side2" placeholder="Tatárska omáčka"></label><label>Cena (€), voliteľné<input class="cost" type="number" min="0" step=".01"></label><button class="danger" type="button">Odstrániť</button>';root.appendChild(d);const fields={name:'.name',side1:'.side1',side2:'.side2',price:'.cost'};Object.entries(fields).forEach(([k,selector])=>{let el=d.querySelector(selector);el.value=m[k];el.addEventListener('input',e=>{m[k]=e.target.value;preview()})});d.querySelector('.dish-select').onchange=e=>{if(e.target.value==='')return;let saved=db.dishes[Number(e.target.value)];if(!saved)return;Object.assign(m,saved);renderEditor();preview()};d.querySelector('.danger').onclick=()=>{meals.splice(i,1);renderEditor();preview()}});refreshDB()}
function preview(){$('psoup').textContent=$('soup').value||'—';const dt=$('date').value;$('pdate').textContent=dt?new Date(dt+'T12:00:00').toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';$('pdishes').innerHTML=meals.filter(m=>m.name.trim()).map((m,i)=>'<div class="dish"><span class="price">'+esc(m.price||$('price').value)+' €</span><strong>'+(i+1)+'. '+esc(m.name)+'</strong><small>'+esc([m.side1,m.side2].filter(Boolean).join(' · '))+'</small></div>').join('')||'Zatiaľ žiadne jedlá';$('pfooter').textContent=$('footer').value}
function refreshSaved(){let dates=Object.keys(localStorage).filter(k=>k.startsWith(key)).map(k=>k.slice(key.length)).sort().reverse();$('saved').innerHTML='<option value="">Vyber dátum</option>'+dates.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('')}
function load(d){if(!d)return;let x=JSON.parse(localStorage.getItem(key+d)||'null');if(!x)return;$('date').value=d;$('soup').value=x.soup||'';$('price').value=x.price||'';$('footer').value=x.footer||'';meals=(x.meals||[]).map(m=>({name:m.name||'',side1:m.side1??m.side??'',side2:m.side2||'',price:m.price||''}));renderEditor();preview()}
['date','soup','price','footer'].forEach(id=>$(id).addEventListener('input',preview));
$('soupSelect').onchange=e=>{if(e.target.value){$('soup').value=e.target.value;preview()}};
$('add').onclick=()=>addMeal();
$('save').onclick=()=>{let d=$('date').value;if(!d){$('notice').textContent='Najprv vyber dátum.';return}try{localStorage.setItem(key+d,JSON.stringify({soup:$('soup').value,price:$('price').value,footer:$('footer').value,meals}));remember();$('notice').textContent='Menu a databáza uložené pre '+d;refreshSaved()}catch(e){$('notice').textContent='Ukladanie zlyhalo. Skontroluj miesto v prehliadači.'}};
$('saved').onchange=e=>load(e.target.value);
$('print').onclick=()=>window.print();
$('export').onclick=()=>{const days={};Object.keys(localStorage).filter(k=>k.startsWith(key)).forEach(k=>{try{days[k.slice(key.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}});const blob=new Blob([JSON.stringify({version:2,db,days},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='u-mastina-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.db||!data.days||!Array.isArray(data.db.soups)||!Array.isArray(data.db.dishes))throw Error('Nesprávny formát');if(!confirm('Importovať zálohu? Rovnaké dátumy sa prepíšu.'))return;db=data.db;saveDB();Object.entries(data.days).forEach(([d,v])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d))localStorage.setItem(key+d,JSON.stringify(v))});refreshSaved();$('notice').textContent='Záloha importovaná'}catch(err){$('notice').textContent='Import zlyhal: '+err.message}};
$('date').value=new Date().toLocaleDateString('en-CA');readDB();addMeal();addMeal();addMeal();refreshSaved();preview();
</script></body></html>
