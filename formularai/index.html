const U='https://www.slovensko.sk/sk/zivotne-situacie/zivotna-situacia/_umrtie2/';
const B='https://www.upsvr.gov.sk/vzory-ziadosti-v-slovenskom-jazyku-a-inych-jazykoch/vzory-ziadosti-pre-oblast-socialnych-veci-a-rodiny/prispevok-na-pohreb.html?lang=sk&page_id=268776';
const PDF='https://www.upsvr.gov.sk/buxus/docs/SSVaR/statne_soc.davky/Ziadost_o_prispevok_na_pohreb_092025.pdf';
const SERVICE='https://www.slovensko.sk/sk/detail-sluzby?externalCode=ks_350922';
const topics=[['first','Čo urobiť ako prvé','Úmrtie doma, v nemocnici alebo v zahraničí'],['funeral','Vybavenie pohrebu','Pohrebná služba a potrebné doklady'],['certificate','Úmrtný list','Zápis na matrike v mieste úmrtia'],['benefit','Príspevok na pohreb','Podmienky, žiadosť a elektronické podanie'],['inheritance','Dedičstvo','Konanie, notár a príprava podkladov'],['car','Prepis zdedeného auta','Postup po skončení dedičského konania'],['contracts','Zmluvy a služby','Banka, energie, voda a telefón'],['pension','Nároky pozostalých','Vdovský, vdovecký a sirotský dôchodok']];
let state={done:[],place:'',buried:false,final:false,notes:''}, storage=true;
try{const old=JSON.parse(localStorage.getItem('formularai-v1'));if(old&&Array.isArray(old.done))state={...state,...old}}catch{storage=false}
const app=document.querySelector('#app');let page='home',filter='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,title)=>/^https:\/\//.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a>`:'';
function save(){try{localStorage.setItem('formularai-v1',JSON.stringify(state))}catch{storage=false}document.querySelector('#notice')?.replaceChildren(document.createTextNode(storage?'Uložené v tomto zariadení.':'Ukladanie je nedostupné. Pred zatvorením si postup vytlačte.'))}
function card(t){return `<button class="card" data-topic="${t[0]}"><span class="arrow">↗</span><strong>${t[1]}</strong><small>${t[2]}</small></button>`}
function render(){app.innerHTML= page==='home'?`<div class="eyebrow">Sprievodca životnými situáciami</div><h1>Viete, čo sa stalo.<br>Pomôžeme s tým,<br>čo nasleduje.</h1><p>Opíšte svoju situáciu vlastnými slovami alebo si vyberte konkrétny krok.</p><form class="search" id="search"><input id="query" aria-label="Opíšte svoju situáciu" placeholder="Napríklad umrel mi otec" required><button class="primary">Nájsť postup →</button></form><div id="result"></div><h2>Keď zomrie blízky človek</h2><div class="grid">${topics.map(card).join('')}</div><footer>Prvá verzia · sprievodca úmrtím a katalóg ${catalog.length} záznamov<br>Údaje o postupe sa ukladajú iba v tomto prehliadači.</footer>`:page==='plan'?plan():page==='catalog'?catalogView():page==='transfer'?transferForm():page==='review'?transferReview():detail(page);app.querySelector('h1,h2')?.setAttribute('tabindex','-1');}
function plan(){const ids=state.place==='abroad'?['first','funeral','certificate','benefit','inheritance','contracts','pension']:topics.map(t=>t[0]);return `<div class="eyebrow">Váš prípad</div><h1>Krok za krokom</h1><p>Je mi ľúto, že vám zomrel blízky človek. Postup si môžete prispôsobiť tomu, čo už máte vybavené.</p><label for="place">Kde došlo k úmrtiu?</label><select id="place"><option value="">Vyberte možnosť</option>${[['home','Doma / mimo nemocnice'],['hospital','V nemocnici alebo zariadení'],['abroad','V zahraničí']].map(([v,t])=>`<option value="${v}" ${state.place===v?'selected':''}>${t}</option>`).join('')}</select><div class="note">${state.place==='home'?'Ak lekár ešte nepotvrdil úmrtie alebo je možná záchrana života, volajte 155 alebo 112.':state.place==='hospital'?'Úmrtie oznamuje zdravotnícke zariadenie. Dohodnite sa s ním na prevzatí dokladov a ďalšom postupe.':state.place==='abroad'?'Najprv kontaktujte slovenský zastupiteľský úrad v štáte úmrtia. Postup závisí od krajiny. V detaile prvého kroku nájdete konzulárnu pomoc.':'Vyberte miesto úmrtia, aby sa zobrazil prvý krok.'}</div><progress max="${ids.length}" value="${ids.filter(x=>state.done.includes(x)).length}"></progress><p class="muted">Hotové ${ids.filter(x=>state.done.includes(x)).length} z ${ids.length}</p>${ids.map(id=>{const t=topics.find(x=>x[0]===id);return `<div class="card step ${state.done.includes(id)?'done':''}"><label><input style="width:auto" type="checkbox" data-done="${id}" ${state.done.includes(id)?'checked':''}> ${t[1]}</label><button class="secondary" data-topic="${id}">Otvoriť krok →</button></div>`}).join('')}<label for="notes">Moje poznámky</label><textarea id="notes" rows="4" style="width:100%;padding:14px;border-radius:12px">${esc(state.notes)}</textarea><p id="notice" role="status">${storage?'Uložené v tomto zariadení.':'Ukladanie je nedostupné.'}</p><div class="toolbar"><button class="secondary" id="print">Vytlačiť postup</button><button class="secondary" id="reset">Vymazať môj postup</button></div>`}
function detail(id){const t=topics.find(t=>t[0]===id);const body={first:`<label for="place">Kde došlo k úmrtiu?</label><select id="place"><option value="">Vyberte miesto</option value="home" ${state.place==='home'?'selected':''}>Doma</option><option value="hospital" ${state.place==='hospital'?'selected':''}>V nemocnici</option><option value="abroad" ${state.place==='abroad'?'selected':''}>V zahraničí</option></select><div class="note">${state.place==='home'?'Ak lekár ešte nepotvrdil úmrtie, kontaktujte 155 alebo 112. Lekár vykoná prehliadku.':state.place==='hospital'?'Kontaktujte zariadenie. Oznámenie úmrtia zabezpečuje poskytovateľ zdravotnej starostlivosti.':state.place==='abroad'?'Spojte sa so slovenským zastupiteľským úradom v príslušnej krajine. Prevoz a zahraničné doklady riešte podľa jeho pokynov.':'Miesto úmrtia určuje prvé kroky.'}</div>${link(U,'Oficiálny postup pri úmrtí')}${link('https://www.mzv.sk/sluzby/konzularne-sluzby/co-pre-vas-mozeme-urobit','Konzulárna pomoc v zahraničí')}`,
funeral:`<p>Po lekárskom potvrdení úmrtia kontaktujte vybranú pohrebnú službu. Dohodnite prevoz, spôsob pochovania a termín. Vyžiadajte si rozpis ceny a potvrdenie o zabezpečení pohrebu.</p><p>So službou si overte, ktoré doklady prevezme a ktoré úkony vybaví na základe splnomocnenia. Odložte si doklady na žiadosť o príspevok.</p>${link(U,'Oficiálny postup')}`,
certificate:`<p>Príslušná je matrika v mieste úmrtia. Zápis úmrtia a vydanie úmrtného listu riešte s touto matrikou alebo poverenou pohrebnou službou.</p><p>Pri zahraničnom úmrtí je potrebný osobitný postup podľa krajiny a dokladov.</p><div class="note">Automatický výber konkrétnej matriky podľa obce doplníme v ďalšej verzii.</div>${link(U,'Doklady a zápis úmrtia')}`,
benefit:`<p>Žiadosť podáva plnoletá fyzická osoba, ktorá zabezpečila pohreb. Pri pohrebe od 1. 1. 2025 je príspevok pri splnení podmienok 200 €. Nárok zaniká po jednom roku od pohrebu.</p><p>Posudzuje sa pobyt žiadateľa aj zomretého. Pri prechodnom pobyte zomretého sa uplatňuje aj podmienka pochovania v SR. Cezhraničné prípady podliehajú osobitnému posúdeniu.</p><h2>Pripravte si</h2><ul><li>Vyplnenú žiadosť a údaje o pohrebe.</li><li>Potvrdenie pohrebnej služby, obce alebo správcu cintorína. Pri elektronickom podaní použite prílohu nižšie.</li><li>Ďalšie doklady podľa pokynov vo formulári a vašej situácie.</li></ul><h2>Kam podať žiadosť</h2><p>Na ÚPSVaR podľa trvalého alebo prechodného pobytu zomretého. Možné je osobné, poštové aj elektronické podanie.</p>${link(PDF,'Otvoriť žiadosť PDF')}${link('https://www.upsvr.gov.sk/buxus/docs/SSVaR/statne_soc.davky/Potvrdenie_pohrebnej_sluzby.pdf','Príloha pre elektronické podanie')}${link(SERVICE,'Otvoriť elektronickú službu')}<div class="note">Elektronická služba vyžaduje prihlásenie a KEP. Žiadosť vyplníte a odošlete v oficiálnom portáli. Podporu podpisovania na vašom Androide treba overiť v portáli.</div>${link(B,'Podmienky a oficiálny zdroj')}`,
inheritance:`<p>Súd začína dedičské konanie aj bez návrhu, keď sa dozvie o úmrtí. Poverí notára. Pripravte si prehľad rodiny, majetku, účtov, zmlúv a dlhov pre povereného notára.</p><p>Pri ďalších prepisoch budete potrebovať právoplatné rozhodnutie o dedičstve.</p>${link('https://www.slovensko.sk/sk/zivotne-situacie/zivotna-situacia/_prava-a-povinnosti-spojene-s-v/','Dedičstvo na Slovensko.sk')}`,
car:`<label><input type="checkbox" id="final" style="width:auto" ${state.final?'checked':''}> Mám právoplatné rozhodnutie o dedičstve</label><div class="note">${state.final?'Pripravte si rozhodnutie o dedičstve, doklad totožnosti a doklady vozidla. S dopravným inšpektorátom si potvrďte podklady pre váš dedičský prípad vrátane PZP, lehoty a poplatku.':'Najprv dokončite dedičské konanie a získajte právoplatné rozhodnutie. Potom pokračujte prepisom vozidla.'}</div><p>Presné podmienky prepisu dedením ešte overujeme. Elektronickú službu zmeny vlastníctva treba posúdiť podľa konkrétneho prípadu.</p>${link('https://www.slovensko.sk/sk/oznamy/detail/_zmeny-pri-evidovani-vozidiel','Informácie o evidencii vozidiel')}`,
contracts:`<p>Vyberte poskytovateľa v katalógu. Podmienky prepisu alebo ukončenia zmluvy sa líšia. Pri majetkových úkonoch môže byť potrebné právoplatné rozhodnutie o dedičstve.</p><button class="primary" data-page="catalog">Vybrať poskytovateľa</button>`,
pension:`<p>Podľa vzťahu k zomretému a splnenia podmienok môže prichádzať do úvahy vdovský, vdovecký alebo sirotský dôchodok. Vyberte príslušný postup v Sociálnej poisťovni.</p>${catalog.filter(x=>/vdovský|vdovecký|sirotský/i.test(x.title)).map(x=>link(x.source,x.title)).join('')}`};return `<button class="secondary" data-page="plan">← Môj postup</button><h1>${t[1]}</h1>${body[id]}<p class="muted">Prvá verzia postupu z 19. 11. 2026. Neoverené časti sú označené priamo v texte.</p><div class="toolbar"><button class="primary" id="complete" data-id="${id}">${state.done.includes(id)?'Označiť ako rozpracované':'Označiť krok ako hotový'}</button></div><p id="notice" role="status"></p>`}
function catalogView(){return `<div class="eyebrow">Katalóg formulárov</div><h1>Tlačivá na jednom mieste</h1><p>${catalog.length} prevzatých záznamov. Miestne tlačivá platia pre uvedenú obec, zmluvné pre daného poskytovateľa. Údaje o doručení a podpise sa postupne overujú.</p><label for="filter">Hľadať úkon, inštitúciu alebo situáciu</label><input id="filter" value="${esc(filter)}" placeholder="Napríklad SPP alebo dôchodok"><div id="catalog-results">${catalogResults()}</div>`}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function wantsVehicleTransfer(input) {
  const words = norm(input).match(/[a-z0-9]+/g) || [];
  const vehicle = words.some(word => /^(auto$|auta$|autom$|automobil|vozidl)/.test(word));
  const transfer = words.some(word => /^(prepis|prepisat|prevod|previest|kup|preda|darov|zded|dedic|zmen)/.test(word));
  return vehicle && transfer;
}
// The draft stays in memory. No personal data is written to shared origin storage.
const vehicleDraft = { reason: 'Kúpa', plate: '', currentHolder: '', nextHolder: '' };
const vehicleFields = [
  ['plate', 'Evidenčné číslo vozidla'],
  ['currentHolder', 'Doterajší držiteľ – meno alebo názov'],
  ['nextHolder', 'Nový držiteľ – meno alebo názov']
];
function transferForm() {
  const reasons = ['Kúpa', 'Predaj', 'Darovanie'];
  return `<button class="secondary" data-page="catalog">← K výsledkom</button>
    <h1>Pripraviť prepis auta</h1><p>Vytvorte si pracovný návrh. Údaje zostanú v tejto karte do jej zatvorenia alebo obnovenia. Podpis a odoslanie úradu sú zatiaľ vo vývoji.</p>
    <form id="transfer-form" autocomplete="off"><label for="reason">Dôvod prepisu</label>
    <select name="reason" id="reason">${reasons.map(reason => `<option ${reason === vehicleDraft.reason ? 'selected' : ''}>${reason}</option>`).join('')}</select>
    ${vehicleFields.map(([key, title]) => `<label for="${key}">${title}</label><input id="${key}" name="${key}" maxlength="120" pattern=".*[^ ].*" required value="${esc(vehicleDraft[key])}">`).join('')}
    <div class="toolbar"><button class="primary">Skontrolovať údaje →</button></div></form>`;
}
function transferReview() {
  return `<h1>Kontrola návrhu prepisu</h1><div class="note">Pracovný návrh · nepodpísaný · neodoslaný</div>
    <dl>${[['reason','Dôvod prepisu'], ...vehicleFields].map(([key,title]) => `<dt>${title}</dt><dd style="margin:4px 0 18px;overflow-wrap:anywhere"><strong>${esc(vehicleDraft[key])}</strong></dd>`).join('')}</dl>
    <p>Pre úradné podanie ešte treba doplniť údaje a prílohy podľa podmienok služby, zabezpečiť kvalifikovaný elektronický podpis a doručenie do evidencie vozidiel.</p>
    <div class="toolbar"><button class="secondary" data-page="transfer">Upraviť údaje</button><button class="primary" id="print">Vytlačiť pracovný návrh</button></div>`;
}
app.addEventListener('input', event => {
  if (event.target.form?.id === 'transfer-form' && Object.hasOwn(vehicleDraft, event.target.name)) {
    vehicleDraft[event.target.name] = event.target.value;
  }
});
app.addEventListener('submit', event => {
  if (event.target.id !== 'transfer-form') return;
  event.preventDefault();
  for (const [key, value] of new FormData(event.target)) vehicleDraft[key] = value.trim();
  page = 'review';
  render();
  scrollTo(0, 0);
});
function vehicleChoices() {
  const base = 'https://www.slovensko.sk/sk/zivotne-situacie/zivotna-situacia/';
  return `<section class="card step"><h2>Prepis auta</h2><p>Z akého dôvodu prepisujete vozidlo?</p>
    <h3>Kúpa, predaj alebo darovanie</h3>
    ${link(base + '_ziadost-o-prevod-drzby-osobne', 'Osobný prepis na dopravnom inšpektoráte')}
    <button class="primary" data-page="transfer">Pripraviť prepis vo FormulárAI →</button>
    <h3>Dedičstvo</h3><button class="secondary" data-topic="car">Prepis zdedeného auta →</button></section>`;
}
function catalogResults(){if(wantsVehicleTransfer(filter)) return vehicleChoices();let list=catalog.filter(x=>norm(x.title+' '+x.institution+' '+x.situations).includes(norm(filter)));return `<p class="muted">${list.length} výsledkov</p>${list.map(x=>`<article class="card step"><small>${esc(x.institution)}</small><h2 style="font-size:19px">${esc(x.title)}</h2><p>${esc(x.instructions)}</p><p class="muted">Podpis · ${esc(x.signature)}<br>Lehota · ${esc(x.deadline)}</p>${link(x.form,'Otvoriť tlačivo')}${link(x.source,'Pokyny poskytovateľa')}</article>`).join('')}`}
app.addEventListener('submit',e=>{if(e.target.id!=='search')return;e.preventDefault();const q=norm(document.querySelector('#query').value);if(wantsVehicleTransfer(q)){filter=document.querySelector('#query').value;page='catalog';render();scrollTo(0,0);return}if(/umr|zomr|ocko|otca|otec|pohreb|dedic|prisli sme/.test(q)){page=/prispev/.test(q)?'benefit':/auto|vozidl/.test(q)?'car':/dedic/.test(q)?'inheritance':'plan';render();scrollTo(0,0)}else{filter=document.querySelector('#query').value;page='catalog';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page||b.dataset.topic){page=b.dataset.page||b.dataset.topic;render();scrollTo(0,0)}if(b.id==='print')print();if(b.id==='complete'){let id=b.dataset.id;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}if(b.id==='reset'&&confirm('Vymazať uložený postup a poznámky z tohto zariadenia?')){state={done:[],place:'',buried:false,final:false,notes:''};save();render()}});
app.addEventListener('change',e=>{if(e.target.id==='place'){state.place=e.target.value;save();render()}if(e.target.id==='final'){state.final=e.target.checked;save();render()}if(e.target.dataset.done){let id=e.target.dataset.done;state.done=e.target.checked?[...new Set([...state.done,id])]:state.done.filter(x=>x!==id);save();render()}});
app.addEventListener('input',e=>{if(e.target.id==='filter'){filter=e.target.value;document.querySelector('#catalog-results').innerHTML=catalogResults()}if(e.target.id==='notes'){state.notes=e.target.value;save()}});render();
if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
