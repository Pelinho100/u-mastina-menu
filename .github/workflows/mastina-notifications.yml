name: U Mastina - upozornenie na nove menu
on:
  repository_dispatch:
    types: [mastina-new-menu]
permissions:
  contents: read
concurrency:
  group: mastina-notify-${{ github.event.client_payload.week }}
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Odoslat push cez OneSignal
        env:
          ONESIGNAL_APP_ID: bdc53520-1dcf-4af7-947e-c20056f31505
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          WEEK: ${{ github.event.client_payload.week }}
        run: |
          set -euo pipefail
          if [ -z "$ONESIGNAL_APP_ID" ] || [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::Nastav GitHub Secret ONESIGNAL_REST_API_KEY"
            exit 1
          fi
          python3 - <<'PY' > /tmp/mastina-push.json
          import json, os
          print(json.dumps({
            "app_id": os.environ["ONESIGNAL_APP_ID"],
            "included_segments": ["Total Subscriptions"],
            "headings": {"en": "🍽️ Nový jedálny lístok na tento týždeň!"},
            "contents": {"en": "Pozrite si, aké chutné obedy sme pre vás pripravili v reštaurácii U Mastina. Tešíme sa na vás! 😊"},
            "url": "https://pelinho100.github.io/u-mastina-menu/obedove-menu.html"
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST https://api.onesignal.com/notifications \
            -H "Authorization: Key $ONESIGNAL_REST_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/mastina-push.json > /tmp/mastina-push-response.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/mastina-push-response.json") as f:
            response = json.load(f)
          print(json.dumps(response, ensure_ascii=False))
          if response.get("errors") or not response.get("id"):
            print("::error::OneSignal nepotvrdil vytvorenie push spravy")
            sys.exit(1)
          PY
